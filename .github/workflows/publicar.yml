name: Publicar no GitHub Pages

# O site é estático: o único build são os PDFs das aulas e das trilhas (tools/gen_pdf.py).
# O pipeline também garante que o que vai ao ar corresponde a trilhas/ — a fonte das trilhas.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; nunca cancela uma que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar a trilha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Testes do progresso e da trilha
        run: node --test tests/*.test.js

      - name: Testes do gerador
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Regenerar as trilhas
        run: python3 tools/gen_roadmap.py

      - name: Conferir se os arquivos gerados estão em dia
        run: |
          # O .xmind é determinístico (data fixa no zip) e fica em docs/trilhas/.
          pendente=$(git status --porcelain --untracked-files=all -- docs/)
          if [ -n "$pendente" ]; then
            echo "::error::Rodar 'python3 tools/gen_roadmap.py' mudou arquivos versionados — uma trilha foi editada sem regenerar, ou falta commitar o esqueleto de uma página nova."
            echo "$pendente"
            git --no-pager diff -- docs/
            exit 1
          fi
          echo "Arquivos gerados em dia."


  publicar:
    name: Publicar
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - id: pages
        uses: actions/configure-pages@v6

      # PDFs das aulas e das trilhas (pasta pdf/, fora do git): WeasyPrint para o
      # PDF e mermaid-cli, com o Chrome do runner, para os diagramas Mermaid.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Dependências dos PDFs
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          pip install -q markdown beautifulsoup4 lxml weasyprint
          echo '{"executablePath":"/usr/bin/google-chrome","args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Gerar os PDFs
        env:
          MMDC: npx -y @mermaid-js/mermaid-cli@11
          MMDC_PUPPETEER: ${{ runner.temp }}/puppeteer.json
          PUPPETEER_SKIP_DOWNLOAD: '1'
        run: python3 tools/gen_pdf.py --saida pdf

      # Site combinado, como vai ficar no domínio: o Gov Hub (gov-hub.io, com a
      # identidade visual nova) na raiz e as trilhas em /capacitacao/.
      # GOVHUB_REF aponta a branch do gov-hub-io que está em avaliação.
      - name: Código do site do Gov Hub
        uses: actions/checkout@v7
        with:
          repository: GovHub-br/gov-hub-io
          ref: ${{ vars.GOVHUB_REF || 'feat/idv-govhub' }}
          path: _govhub

      - name: Gerar o site do Gov Hub (MkDocs)
        working-directory: _govhub
        run: |
          pip install -q -r requirements.txt "mkdocs-material[recommended]"
          mkdocs build --site-dir "$GITHUB_WORKSPACE/_site"

      # As trilhas vão como estão: doc.html lê os .md em tempo de execução, então
      # o repositório inteiro precisa ir junto (com a pasta pdf/ gerada acima).
      - name: Montar o site (trilhas em /capacitacao/)
        run: |
          mkdir -p _site/capacitacao
          rsync -a --exclude .git --exclude .github --exclude _govhub --exclude _site ./ _site/capacitacao/
          python3 tools/montar_site.py _site "${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
